<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grain simulator</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b1020; color: #e6ecff; }
    body { margin: 0; display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 16px; padding: 16px; min-height: 100vh; box-sizing: border-box; }
    section { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 12px; color: #9fb0d8; display: flex; flex-direction: column; gap: 4px; }
    input, select, button { font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid #2a3560; background: #121a33; color: inherit; }
    button { cursor: pointer; background: #1e2d5c; }
    .phone { width: 390px; height: 780px; border: 1px solid #2a3560; border-radius: 28px; overflow: hidden; background: #fff; }
    iframe { width: 100%; height: 100%; border: 0; }
    pre { font-size: 11px; white-space: pre-wrap; background: #070b17; padding: 10px; border-radius: 10px; max-height: 40vh; overflow: auto; }
    .row { display: flex; gap: 8px; }
    @media (max-width: 800px) { body { grid-template-columns: 1fr; } .phone { width: 100%; } }
  </style>
</head>
<body>
  <section>
    <h1 style="font-size:18px;margin:0">Grain simulator</h1>
    <p style="font-size:12px;color:#9fb0d8;margin:0">Plays a Saltix wallet's side of the bridge (12-grains §5). Sign-in signatures are real; payments are not made.</p>
    <label>Grain URL <input id="url" value="/examples/hello-grain/index.html"></label>
    <div class="row"><button id="manifest">Load a manifest</button><button id="open">Open</button></div>
    <label>Slug <input id="slug" value="hello-grain"></label>
    <label>Start <input id="start" placeholder="optional"></label>
    <div class="row">
      <label>Language <select id="language"><option>en</option><option>ru</option></select></label>
      <label>Theme <select id="theme"><option>dark</option><option>light</option></select></label>
    </div>
    <div class="row"><button id="hide">Hide</button><button id="show">Show</button></div>
    <div class="row"><button id="frame">Frame to the grain</button><button id="notification">Check a notification</button></div>
    <label>Address (for requestAddress) <input id="address" value="dsalt1q…"></label>
    <label>Owner key (Ed25519 hex, or {"p256": "…"}; to check invoices and notifications) <input id="owner"></label>
    <label>Genesis hash (hex, to check invoices and notifications) <input id="genesis"></label>
    <pre id="log"></pre>
  </section>
  <div class="phone"><iframe id="grain" name="saltix-simulator" title="grain"></iframe></div>
  <script type="module" src="./dist/simulator.js"></script>
</body>
</html>
